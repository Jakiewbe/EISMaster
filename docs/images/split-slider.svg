<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-label="Manual split slider explanation">
  <rect width="1080" height="300" rx="18" fill="#111318"/>
  <text x="42" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#f8fafc">Manual arc segmentation</text>
  <text x="42" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#aab2c0">Drag one or two split handles to tell the fitter which points belong to the semicircle arcs and where the diffusion tail starts.</text>
  <line x1="110" y1="160" x2="970" y2="160" stroke="#2a2a30" stroke-width="10" stroke-linecap="round"/>
  <line x1="110" y1="160" x2="450" y2="160" stroke="#ffb74d" stroke-width="10" stroke-linecap="round"/>
  <line x1="450" y1="160" x2="720" y2="160" stroke="#4dd0e1" stroke-width="10" stroke-linecap="round"/>
  <circle cx="450" cy="160" r="17" fill="#f8fafc" stroke="#8b8ba7" stroke-width="4"/>
  <circle cx="720" cy="160" r="17" fill="#f8fafc" stroke="#8b8ba7" stroke-width="4"/>
  <text x="154" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffcc80">Arc 1</text>
  <text x="536" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#80deea">Arc 2</text>
  <text x="814" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#cbd5e1">Tail</text>
  <text x="402" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#aab2c0">split 1</text>
  <text x="672" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#aab2c0">split 2</text>
  <path d="M450 186 v-14" stroke="#8b8ba7" stroke-width="2"/>
  <path d="M720 186 v-14" stroke="#8b8ba7" stroke-width="2"/>
</svg>
