<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-label="EISMaster analysis workflow">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#1b2028"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1080" height="360" rx="18" fill="url(#bg)"/>
  <text x="40" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">EISMaster workflow</text>
  <text x="40" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#aab2c0">Import spectra, inspect quality, segment arcs, fit circuits, export publication-ready results.</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(42 130)">
      <rect width="150" height="120" rx="12" fill="#202633" stroke="#3a4354"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#e5edf8">1. Import</text>
      <text x="22" y="70" font-size="13" fill="#aab2c0">BIN / TXT / CSV</text>
      <path d="M102 75 h24 v22 h-50 v-44 h26 z" fill="none" stroke="#4fc3f7" stroke-width="3"/>
      <path d="M102 53 v22 h24" fill="none" stroke="#4fc3f7" stroke-width="3"/>
    </g>
    <g transform="translate(238 130)">
      <rect width="150" height="120" rx="12" fill="#202633" stroke="#3a4354"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#e5edf8">2. Inspect</text>
      <text x="22" y="70" font-size="13" fill="#aab2c0">Nyquist + Bode</text>
      <polyline points="35,96 58,74 82,87 112,54" fill="none" stroke="#81d4fa" stroke-width="4" stroke-linecap="round"/>
      <circle cx="58" cy="74" r="4" fill="#81d4fa"/>
      <circle cx="82" cy="87" r="4" fill="#81d4fa"/>
      <circle cx="112" cy="54" r="4" fill="#81d4fa"/>
    </g>
    <g transform="translate(434 130)">
      <rect width="150" height="120" rx="12" fill="#202633" stroke="#3a4354"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#e5edf8">3. Segment</text>
      <text x="22" y="70" font-size="13" fill="#aab2c0">Auto or manual</text>
      <line x1="30" y1="92" x2="120" y2="92" stroke="#4dd0e1" stroke-width="5" stroke-linecap="round"/>
      <circle cx="74" cy="92" r="9" fill="#f8fafc" stroke="#8b8ba7" stroke-width="3"/>
    </g>
    <g transform="translate(630 130)">
      <rect width="150" height="120" rx="12" fill="#202633" stroke="#3a4354"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#e5edf8">4. Fit</text>
      <text x="22" y="70" font-size="13" fill="#aab2c0">R(QRWo), dual arc</text>
      <path d="M32 94 C50 52, 88 52, 108 94" fill="none" stroke="#ffb74d" stroke-width="4"/>
      <path d="M65 94 C76 70, 102 70, 120 94" fill="none" stroke="#ff6b4a" stroke-width="4"/>
    </g>
    <g transform="translate(826 130)">
      <rect width="150" height="120" rx="12" fill="#202633" stroke="#3a4354"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#e5edf8">5. Export</text>
      <text x="22" y="70" font-size="13" fill="#aab2c0">TXT / CSV / XLSX</text>
      <path d="M75 52 v42" stroke="#30d158" stroke-width="4" stroke-linecap="round"/>
      <path d="M56 78 l19 19 l19 -19" fill="none" stroke="#30d158" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="43" y="99" width="64" height="10" rx="3" fill="#30d158"/>
    </g>
  </g>

  <g stroke="#5b6474" stroke-width="3" stroke-linecap="round">
    <path d="M202 190 h26"/>
    <path d="M398 190 h26"/>
    <path d="M594 190 h26"/>
    <path d="M790 190 h26"/>
  </g>
</svg>
