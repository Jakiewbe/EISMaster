<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">EISMaster — 从辰华数据，到阻抗分析</title>
  <desc id="desc">深色背景与绿色强调色。左侧介绍桌面阻抗谱分析工具，底部列出辰华文件直读、单谱图与批量拟合、MATLAB DRT 集成；右侧为带半圆与扩散尾部的 Nyquist 谱示意，不代表实测数据。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#29312E" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="#121214" />
  <rect x="770" y="32" width="382" height="278" fill="url(#grid)" opacity="0.6" />
  <path d="M 48 44 H 88" stroke="#2AE88A" stroke-width="4" />
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="104" y="50" fill="#A8B5AD" font-size="18" letter-spacing="2">ELECTROCHEMICAL IMPEDANCE</text>
    <text x="48" y="129" fill="#F2F5F3" font-size="62" font-weight="700">EISMaster</text>
    <text x="48" y="191" fill="#F2F5F3" font-size="38" font-weight="600">从辰华数据，到阻抗分析</text>
    <text x="48" y="239" fill="#A8B5AD" font-size="24">读取原始文件，查看谱图、拟合与参数趋势。</text>
    <text x="1107" y="96" fill="#A8B5AD" font-size="20">−Z″</text>
    <text x="1106" y="281" fill="#A8B5AD" font-size="20">Z′</text>
  </g>
