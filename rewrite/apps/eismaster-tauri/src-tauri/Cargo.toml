[package]
name = "eismaster-tauri"
version = "0.1.0"
edition = "2021"
description = "EISMaster desktop application (Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eismaster-core = { path = "../../../crates/eismaster-core" }

[lib]
name = "eismaster_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
